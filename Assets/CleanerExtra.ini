; 国产软件清理规则补充
; 与 Winapp2.ini 同格式，只收录 Winapp2 缺少的国内常用软件。
; 规则本身同样以 CC-BY-SA-4.0 授权，可自由修改与再分发。
;
; LangSecRef 约定：
;   4001 = 腾讯应用
;   4002 = 网易应用
;   4003 = 国产影音
;   4004 = 国产游戏
;   4005 = 安全与工具
;
; 只清理缓存、日志、崩溃报告这类可再生成的数据，不碰聊天记录与下载内容。

[腾讯 QQ 缓存与日志]
LangSecRef=4001
DetectFile=%AppData%\QQ
FileKey1=%AppData%\QQ\Cache|*|REMOVESELF
FileKey2=%AppData%\QQ\Code Cache|*|REMOVESELF
FileKey3=%AppData%\QQ\log|*|RECURSE
FileKey4=%AppData%\QQ\qqex\logs|*|RECURSE
FileKey5=%AppData%\QQ\qqex\logs-cache|*|RECURSE
FileKey6=%AppData%\QQ\Crashpad\reports|*|RECURSE
FileKey7=%AppData%\QQ\Crashpad\attachments|*|RECURSE
FileKey8=%AppData%\QQ\Crashpad\log|*|RECURSE

[腾讯 QQ 临时文件]
LangSecRef=4001
DetectFile1=%AppData%\Tencent\QQ
DetectFile2=%AppData%\Tencent\QQNT
FileKey1=%AppData%\Tencent\QQ\STemp|*|RECURSE
FileKey2=%AppData%\Tencent\QQNT\STemp|*|RECURSE

[QQ 音乐日志与缓存]
LangSecRef=4001
DetectFile=%AppData%\Tencent\QQMusic
FileKey1=%AppData%\Tencent\QQMusic\log|*|RECURSE
FileKey2=%AppData%\Tencent\QQMusic\wmpf|*|RECURSE

[腾讯通用日志]
LangSecRef=4001
DetectFile=%AppData%\Tencent\Logs
FileKey1=%AppData%\Tencent\Logs|*.log;*.dmp|RECURSE

[腾讯微信（新版）日志与崩溃报告]
LangSecRef=4001
DetectFile1=%AppData%\Tencent\xwechat
DetectFile2=%AppData%\Tencent\WeChat
FileKey1=%AppData%\Tencent\xwechat\log|*|RECURSE
FileKey2=%AppData%\Tencent\xwechat\crashinfo|*|RECURSE
FileKey3=%AppData%\Tencent\xwechat\update|*|RECURSE
FileKey4=%AppData%\Tencent\WeChat\log|*|RECURSE

[腾讯 WeGame 缓存]
LangSecRef=4004
DetectFile=%AppData%\Tencent\WeGame
FileKey1=%AppData%\Tencent\WeGame\qbcore91\cache|*|RECURSE

[网易云音乐缓存与日志]
LangSecRef=4002
DetectFile=%LocalAppData%\NetEase\CloudMusic
FileKey1=%LocalAppData%\NetEase\CloudMusic\Cache|*|REMOVESELF
FileKey2=%LocalAppData%\NetEase\CloudMusic\Log|*|RECURSE
FileKey3=%LocalAppData%\NetEase\CloudMusic\Temp|*|RECURSE
FileKey4=%LocalAppData%\NetEase\CloudMusic\dumps|*|RECURSE
FileKey5=%LocalAppData%\NetEase\CloudMusic\ad|*|REMOVESELF
FileKey6=%LocalAppData%\NetEase\CloudMusic\preview|*|REMOVESELF

[360 安全卫士日志]
LangSecRef=4005
DetectFile=%AppData%\360Safe
FileKey1=%AppData%\360Safe|*.log;*.dmp|RECURSE
